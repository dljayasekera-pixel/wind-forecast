[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windcast"
version = "0.2.0"
description = "Utility-scale wind power forecasting from SCADA and multi-provider NWP"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.67", "plotly>=5.20"]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
windcast = "windcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
windcast = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests that train models"]
filterwarnings = ["ignore::FutureWarning"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
